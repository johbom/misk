<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hover Pads – ljud &amp; MIDI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-tab="notes">
  <!-- Webbläsare kräver ett klick innan ljud får spelas -->
  <div id="start-overlay">
    <button id="start-btn">Klicka för att starta</button>
    <p>Ljud och MIDI kräver ett klick först (webbläsarens regel).</p>
  </div>

  <header>
    <h1>Hover Pads</h1>
    <nav id="tabs">
      <button type="button" data-tab="notes">Toner</button>
      <button type="button" data-tab="chords">Ackord</button>
      <button type="button" data-tab="settings">Inställningar</button>
    </nav>
    <span id="midi-status" class="status">MIDI: ej ansluten</span>
  </header>

  <!-- Det enda som syns i spelläge: preset och volym -->
  <section id="play-bar">
    <label>Preset
      <select id="preset"></select>
    </label>
    <label>Volym
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.6" />
    </label>
  </section>

  <!-- ===== Fliken Inställningar ===== -->
  <section id="settings" class="only-settings">
    <div id="controls">
      <fieldset>
        <legend>Utgång</legend>
        <label><input type="checkbox" id="out-audio" checked /> Ljud</label>
        <label><input type="checkbox" id="out-midi" /> MIDI</label>
      </fieldset>

      <fieldset>
        <legend>Spelsätt</legend>
        <label>
          <select id="play-mode">
            <option value="hold">Håll – ton så länge musen är över</option>
            <option value="oneshot">Kort ton vid mouseover</option>
          </select>
        </label>
        <label title="Tomrum mellan rutorna, så att musen kan flyttas utan att trigga dem">Mellanrum
          <input type="range" id="pad-gap" min="0" max="160" step="4" value="48" />
          <span id="gap-value">48 px</span>
        </label>
      </fieldset>

      <fieldset id="formation-set">
        <legend>Formation</legend>
        <input type="hidden" id="formation" value="grid" />
        <div id="formation-buttons" role="radiogroup" aria-label="Formation"></div>
      </fieldset>

      <fieldset>
        <legend>MIDI</legend>
        <label>Enhet
          <select id="midi-out"><option value="">– ingen –</option></select>
        </label>
        <label>Kanal
          <input type="number" id="midi-ch" min="1" max="16" value="1" />
        </label>
        <label>Velocity
          <input type="range" id="velocity" min="1" max="127" value="100" />
        </label>
        <button id="panic" type="button" title="Skicka 'All Notes Off'">Panik</button>
      </fieldset>

      <fieldset>
        <legend>Sidan Toner</legend>
        <label>Grundton
          <select id="root"></select>
        </label>
        <label>Oktav
          <input type="number" id="octave" min="0" max="8" value="4" />
        </label>
        <label>Skala
          <select id="scale">
            <option value="major">Dur</option>
            <option value="minor">Moll</option>
            <option value="pentatonic">Pentatonisk</option>
            <option value="blues">Blues</option>
            <option value="chromatic">Kromatisk</option>
          </select>
        </label>
      </fieldset>
    </div>

    <fieldset id="chord-settings">
      <legend>Sidan Ackord</legend>
      <div class="row">
        <label>Antal
          <select id="chord-count">
            <option>2</option><option>3</option><option selected>4</option><option>5</option>
            <option>6</option><option>7</option><option>8</option>
          </select>
        </label>
        <label>Oktav
          <input type="number" id="chord-octave" min="1" max="7" value="4" />
        </label>
        <label><input type="checkbox" id="chord-bass" checked /> Bas</label>
        <label title="Visar voicing och oktavläge per ackord"><input type="checkbox" id="chord-advanced" /> Avancerat (voicing)</label>
      </div>
      <!-- Ett ackordval per ruta (byggs av app.js) -->
      <div id="chord-editor"></div>
    </fieldset>

    <!-- Alla reglage för ljudmotorn (byggs av app.js från SYNTH_PARAMS i synth.js) -->
    <fieldset id="synth">
      <legend>Ljudmotor</legend>
      <div id="synth-groups"></div>
      <div id="synth-actions">
        <button id="synth-reset" type="button">Återställ preset</button>
        <button id="synth-random" type="button">Slumpa ljud</button>
      </div>
    </fieldset>
  </section>

  <!-- ===== Spelflikarna ===== -->
  <main id="pads" class="pad-grid only-notes"></main>
  <main id="chord-pads" class="pad-grid only-chords"></main>

  <!-- Högerklicksmeny på sidan Ackord: byt ackord direkt på rutan/bollen -->
  <div id="chord-picker" hidden>
    <div class="cp-head">
      <strong id="cp-title"></strong>
      <button type="button" id="cp-close" title="Stäng (Esc)">✕</button>
    </div>
    <div class="cp-label">Grundton</div>
    <div id="cp-roots" class="cp-grid"></div>
    <div class="cp-label">Typ</div>
    <div id="cp-types" class="cp-grid"></div>
    <div class="adv-only">
      <div class="cp-label">Voicing</div>
      <div id="cp-voicings" class="cp-grid"></div>
      <div class="cp-label">Oktavläge</div>
      <div id="cp-shifts" class="cp-grid"></div>
      <div id="cp-notes"></div>
    </div>
  </div>

  <footer>
    <p id="log">Dra en ljudfil (wav/mp3) till en ruta på sidan Toner för att byta dess ljud.</p>
  </footer>

  <script src="synth.js"></script>
  <script src="layout.js"></script>
  <script src="app.js"></script>
</body>
</html>
